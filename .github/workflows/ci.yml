name: CI

on:
  push:
    tags: [ v* ]
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Weekly, so a CVE disclosed after a release still turns CI red.
  schedule:
    - cron: '0 6 * * 1'

jobs:

  tests:
    name: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up Go 1.x
      uses: actions/setup-go@v6
      with:
        # Latest stable release, so each build picks up Go security patches.
        # go.mod's toolchain line stays the minimum for local builds.
        go-version: 'stable'
        check-latest: true
    
    - name: Run test.sh
      run: |
        scripts/test.sh

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Check Go stdlib and modules for known vulnerabilities
      uses: golang/govulncheck-action@v1
      with:
        go-version-input: 'stable'
        check-latest: true

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
      pull-requests: read
      checks: write
    needs: [ tests, govulncheck ]
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up Go 1.x
      uses: actions/setup-go@v6
      with:
        # Latest stable release, so each build picks up Go security patches.
        # go.mod's toolchain line stays the minimum for local builds.
        go-version: 'stable'
        check-latest: true

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Docker Login
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9

    - name: Prepare a snapshot release
      if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
      uses: goreleaser/goreleaser-action@v6
      with:
        version: latest
        args: release --clean --snapshot
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DOCKER_CLI_EXPERIMENTAL: "enabled"

    - name: Release a new version
      if: ${{ startsWith(github.ref, 'refs/tags/v') }}
      uses: goreleaser/goreleaser-action@v6
      with:
        version: latest
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DOCKER_CLI_EXPERIMENTAL: "enabled"

