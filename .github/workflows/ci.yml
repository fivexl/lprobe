name: CI

on:
  push:
    tags: [ v* ]
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Weekly, so a CVE disclosed after a release still turns CI red.
  schedule:
    - cron: '0 6 * * 1'

permissions: {}

env:
  GORELEASER_VERSION: v2.20.0
  GOLANGCI_LINT_VERSION: v2.15.0
  SYFT_VERSION: v1.57.0
  IMAGE: ghcr.io/fivexl/lprobe

jobs:

  tests:
    name: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        # Latest stable release, so each build picks up Go security patches.
        # go.mod's toolchain line stays the minimum for local builds.
        go-version: 'stable'
        check-latest: true

    - name: Run test.sh
      run: |
        scripts/test.sh

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Check Go stdlib and modules for known vulnerabilities
      uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
      with:
        go-version-input: 'stable'
        check-latest: true

  build:
    name: Build
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [ tests, govulncheck ]
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 'stable'
        check-latest: true

    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

    - name: golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: ${{ env.GOLANGCI_LINT_VERSION }}

    - name: Install syft
      uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        syft-version: ${{ env.SYFT_VERSION }}

    - name: Prepare a snapshot release
      uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
      with:
        version: ${{ env.GORELEASER_VERSION }}
        args: release --clean --snapshot --skip=sign

  # Separate from build so pull requests never hold a write token.
  release:
    name: Release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write       # GitHub release
      packages: write       # push to ghcr.io
      id-token: write       # keyless signing
      attestations: write   # build provenance
    needs: [ tests, govulncheck ]
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 'stable'
        check-latest: true

    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

    - name: Docker Login
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Install cosign
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

    - name: Install syft
      uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        syft-version: ${{ env.SYFT_VERSION }}

    - name: Release a new version
      uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
      with:
        version: ${{ env.GORELEASER_VERSION }}
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Attest binary provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-checksums: dist/checksums.txt

    # SBOMs go on the per-platform images, as BuildKit does, because each
    # holds a different binary.
    - name: Attest image SBOMs
      id: images
      env:
        VERSION: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        version="${VERSION#v}"
        for arch in amd64 arm64v8; do
          digest=$(docker buildx imagetools inspect "$IMAGE:$version-$arch" --format '{{.Manifest.Digest}}')
          syft scan "registry:$IMAGE@$digest" -o "spdx-json=sbom-$arch.spdx.json"
          cosign attest --yes --type spdxjson --predicate "sbom-$arch.spdx.json" "$IMAGE@$digest"
        done
        index=$(docker buildx imagetools inspect "$IMAGE:$version" --format '{{.Manifest.Digest}}')
        echo "index-digest=$index" >> "$GITHUB_OUTPUT"

    - name: Attest image provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ${{ env.IMAGE }}
        subject-digest: ${{ steps.images.outputs.index-digest }}
        push-to-registry: true
