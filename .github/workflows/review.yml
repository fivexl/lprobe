name: Update review branch

on:
  workflow_dispatch:

jobs:
  review:
    name: Review
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: main
        fetch-depth: 0

    - name: Update review branch
      id: update-review
      run: |
        git push origin main:review
